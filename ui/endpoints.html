<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cilium endpoint map</title>
        <link rel="stylesheet" href="cilium.css" />
        <!-- The bridge to the app. Served by k8sdockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body class="page page-map">
        <header class="top">
            <div class="brand">
                <span id="logo"></span>
                <div>
                    <h1>Endpoint map</h1>
                    <p id="where" class="faint">Connecting…</p>
                </div>
            </div>
            <label class="search">
                <span id="search-icon"></span>
                <input id="query" type="search" placeholder="Find a pod, IP, identity or label" autocomplete="off" spellcheck="false" />
            </label>
            <div id="lens" class="lens-wrap"></div>
            <nav class="top-actions" id="top-actions"></nav>
        </header>

        <p id="error" class="banner error" hidden></p>
        <section id="empty" class="empty" hidden></section>

        <div id="board" class="board" hidden>
            <section id="stats" class="stats"></section>
            <div class="bar">
                <nav id="filters" class="filters" aria-label="Filter endpoints"></nav>
                <div id="legend" class="lens-legend"></div>
            </div>
            <div id="notice" class="notice" hidden></div>
            <main id="islands" class="islands"></main>
        </div>

        <!-- Behind the inspector when it covers the map: a click on it closes it. -->
        <div id="scrim" class="scrim"></div>
        <aside id="drawer" class="drawer" hidden aria-live="polite"></aside>

        <!-- Classic scripts, not type="module": a sandboxed frame has an opaque
             origin, so a module would be a cross-origin load. -->
        <script src="model.js"></script>
        <script src="kit.js"></script>
        <script src="endpoints.js"></script>
    </body>
</html>
